# improvement ループの調整値
#
# このファイルはユーザーが所有する。値を変えればループの挙動が変わる。
#
# backlog CLI はこのファイルを読まない。CLI が読むのは同じ階層の config.yml だけで、
# こちらは .claude/skills/improvement-dispatcher/SKILL.md が参照する専用の設定である。
# したがって `backlog config set` では変更できない。直接編集すること。
#
# .backlog/ は .git/info/exclude に登録され除外されるため、このファイルはバージョン管理されない。
# 新しい機体には存在しない。ファイルが無い場合やキーが欠けている場合、
# スキルは各項目に併記した既定値で動く。

improvement_loop:
  # In Review がこの件数以上溜まっていたら、新規の引き渡しを止める。
  # レビューが追いつかないまま作業ブランチだけが増えるのを防ぐための上限である。
  # 既定値: 3
  max_in_review: 3

  # 同時に In Progress にできるタスクの件数。
  # 主作業木を共有しているため、2 以上にすると複数のサブエージェントが
  # 同じ作業木でブランチを奪い合い、変更が混ざる。1 のままが安全である。
  # 既定値: 1
  max_in_progress: 1

  # 同じタスクを再引き渡しできる回数。この回数を使い切っても受入基準を
  # 満たせない場合は blocked:needs-decision を付けて人間の判断に回す。
  # 既定値: 2
  max_redispatch: 2
