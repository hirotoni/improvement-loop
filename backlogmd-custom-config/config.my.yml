# improvement ループの調整値
#
# このファイルはユーザーが所有する。値を変えればループの挙動が変わる。
#
# backlog CLI はこのファイルを読まない。CLI が読むのは同じ階層の config.yml だけで、
# こちらは .claude/skills/improvement-dispatch/SKILL.md が参照する専用の設定である。
# したがって `backlog config set` では変更できない。直接編集すること。
#
# .backlog/ は .git/info/exclude に登録され除外されるため、このファイルはバージョン管理されない。
# 新しい機体には存在しない。ファイルが無い場合やキーが欠けている場合、
# スキルは各項目に併記した既定値で動く。

improvement_loop:
  # In Review がこの件数以上溜まっていたら、新規の引き渡しを止める。
  # レビューが追いつかないまま作業ブランチだけが増えるのを防ぐための上限である。
  # 既定値: 3
  max_in_review: 3

  # 同時に In Progress にできるタスクの件数。
  # 以前は主作業木を複数のサブエージェントで共有しており、2 以上にすると
  # 同じ作業木でブランチを奪い合い、変更が混ざる制約があった。
  # 現在は improvement-dispatch の手順 5 でタスクごとに独立したワークツリー
  # （既定ではリポジトリルート配下の .worktree/。worktree_base_dir で
  # 変更可能）に分離しており、その制約は成立しない。値を引き上げるかどうかは
  # 別途判断するため、ここでは 1 のまま据え置く。
  # 既定値: 1
  max_in_progress: 1

  # 同じタスクを再引き渡しできる回数。この回数を使い切っても受入基準を
  # 満たせない場合は blocked:needs-decision を付けて人間の判断に回す。
  # 既定値: 2
  max_redispatch: 2

  # Approved になったタスクを dispatch が main に自動マージするかどうか。
  # true: このリポジトリで PR を運用していない前提。Approved を検知したら
  #       ローカルで main に ff-only（または衝突が無ければ no-ff）マージし、
  #       Done にする（push はしない）。
  # false: GitHub 上で PR ベースの開発フローを運用している前提。Approved を
  #        検知しても main にはマージせず、そのまま残す。人間が PR で正規に
  #        レビュー・マージした後、手動で Done にする。
  # キーが無い場合の既定値も false（マージしない）である。
  # 既定値: false
  auto_merge_reviewed: false

  # ワークツリーの作成先ベースディレクトリ（improvement-dispatch 手順 5）。
  # 空文字（既定）ならリポジトリルート配下の .worktree/ を使う。この配置は
  # 標準的で分かりやすく、下記の .git/info/exclude 自動除外も既定パスに対して
  # 機能するため、git status に汚れとして現れない。
  # 複数リポジトリを横断した作業をしたい場合など、リポジトリの親ディレクトリ
  # 等を明示したい場合は、絶対パス、またはリポジトリルート起点の相対パス
  # （例: "../.worktree"）を指定できる。
  # 実際の作成先はこの配下にさらにリポジトリ名で名前空間分けされる
  # （<設定値>/<リポジトリ名>/task-<n>-<スラッグ>）。同じ親ディレクトリを共有する
  # 兄弟リポジトリ同士でパスが衝突しないという既存の保証は、設定値を変えても崩れない。
  # リポジトリルート内を指すパスを指定した場合、手順 5 がワークツリー作成時に
  # .git/info/exclude へ自動的に除外パターンを追加するため、git の追跡対象には
  # 入らない（手動での追記は不要）。リポジトリ外を指す場合は追記されない。
  # 既定値: ""（= リポジトリルート/.worktree）
  worktree_base_dir: ""

  # AIエージェント（improvement-work やその配下で動く実装パスなど）が変更しては
  # いけないパス（禁止リスト）。前方一致（配下のファイル・ディレクトリを含む）で
  # 扱う。ここに列挙したパスは次の二層で効く。
  #   1. improvement-dispatch が手順5でサブエージェントに引き渡すプロンプトに
  #      「変更してはいけないパス」として明記される（AIエージェントへの指示）。
  #   2. improvement-work の手順8（コミット直前）と improvement-dispatch の手順6
  #      （完了検証）で、変更ファイル一覧と機械的に突き合わせられる。照合は
  #      claude-skills/improvement-dispatch/scripts/check-forbidden-allowed-paths
  #      が行い、一致すれば VIOLATION として検知されてコミット・完了が止まる。
  # 【機械的に止まる範囲と止まらない範囲】2. の照合に渡される変更ファイル一覧は、
  # 呼び出し側2箇所とも git の差分（git diff）から作られる。したがって機械的に
  # 止まるのは git の追跡対象パスへの変更だけである。git 管理外のパスは差分に
  # 一度も現れないため、ここに書いても機械的には止まらず、1. のAIエージェントへの
  # 指示としてのみ効く。bin/setup-improvement-loop が導入時に .git/info/exclude へ
  # 登録するため、次のパスが git 管理外になる。
  #   - ".backlog/" 配下。この config.my.yml 自身を含む。つまりエージェントを縛る
  #     この設定ファイルの書き換えは、機械的には検知されない。
  #   - ".claude/skills/<スキル名>" 配下。配布元 improvement-loop リポジトリの実体
  #     へのシンボリックリンクであり、書き換えると配布元が変わって同じ配布元を
  #     共有する他の導入先リポジトリにも波及するが、このリポジトリの git 差分には
  #     現れない。
  #   - ".git/" 配下。.git/info/exclude 自身を含み、そもそも追跡対象にならない。
  # これらを守りたい場合は、ここへの記載だけに頼らず、人間によるレビューを前提に
  # すること。
  # 複数指定する場合は、インライン配列（例: ["secrets/", "vendor/"]）でも、
  # 改行を伴う複数行のYAMLリスト（次行以降に `- "secrets/"` のように1行1件で
  # 列挙する形式）でも書ける。どちらの記法で書いても
  # claude-skills/improvement-dispatch/scripts/check-forbidden-allowed-paths
  # が同じように配列として読み取る。
  # 空配列（既定）、またはキー自体が無い場合は制限なし（従来どおり）。
  # 既定値: []
  forbidden_paths: []

  # AIエージェントが変更してよいパス（許可リスト）。設定すると、ここに列挙した
  # パス以外への変更を避けるよう、同じく引き渡しプロンプトに明記され、同じ
  # check-forbidden-allowed-paths による機械的な照合の対象にもなる。
  # forbidden_paths と併用した場合は「許可リストの範囲内、かつ禁止リストに無い
  # パス」だけが許可される。
  # 機械的に止まる範囲と止まらない範囲は forbidden_paths と同じである。git 管理外
  # のパス（".backlog/"、".claude/skills/<スキル名>"、".git/" の配下）は git 差分に
  # 現れないため、許可リストの範囲外への変更であっても機械的には検知されない。
  # 複数指定する場合はインライン配列で書く（例: ["src/", "tests/"]）。
  # 空配列（既定）、またはキー自体が無い場合は制限なし（すべてのパスを許可）。
  # 既定値: []
  allowed_paths: []
