# improvement ループの調整値。このファイルはユーザーが所有する。
#
# backlog CLI はこのファイルを読まない（CLI が読むのは同じ階層の config.yml だけ）。
# したがって `backlog config set` では変更できない。直接編集すること。
#
# .backlog/ は .git/info/exclude で除外されるためバージョン管理されない。
# ファイルが無い場合やキーが欠けている場合、スキルは各項目の既定値で動く。
#
# 各キーがループのどの手順に効くかは
# .claude/skills/improvement-dispatch/SKILL.md の調整値の表が正本。

improvement_loop:
  # In Review がこの件数以上溜まっていたら、新規の引き渡しを止める。
  # 既定値: 3
  max_in_review: 3

  # 同時に In Progress にできるタスクの件数。
  # 既定値: 1
  max_in_progress: 1

  # 同じタスクを再引き渡しできる回数。使い切っても受入基準を満たせない場合は
  # blocked:needs-decision を付けて人間の判断に回す。
  # 既定値: 2
  max_redispatch: 2

  # Approved になったタスクを dispatch が main に自動マージするかどうか。
  # true:  PR を運用していない前提。ローカルで main にマージして Done にする（push はしない）。
  # false: PR ベースの開発フローを運用している前提。マージせず残し、人間が PR で
  #        マージした後に手動で Done にする。
  # 既定値: false（キーが無い場合も false）
  auto_merge_reviewed: false

  # ワークツリーの作成先ベースディレクトリ。絶対パス、またはリポジトリルート起点の
  # 相対パス（例: "../.worktree"）を指定できる。実際の作成先はこの配下にさらに
  # リポジトリ名で名前空間分けされる（<設定値>/<リポジトリ名>/task-<n>-<スラッグ>）。
  # リポジトリルート内を指す場合は .git/info/exclude へ自動で除外パターンが追加される
  # （手動での追記は不要）。リポジトリ外を指す場合は追記されない。
  # 既定値: ""（= リポジトリルート/.worktree）
  worktree_base_dir: ""

  # AIエージェントが変更してはいけないパス（禁止リスト）。前方一致で、配下の
  # ファイル・ディレクトリを含む。次の二層で効く。
  #   1. 引き渡しプロンプトに「変更してはいけないパス」として明記される（指示）。
  #   2. improvement-work の手順8（コミット直前）と improvement-dispatch の手順6
  #      （完了検証）で、変更ファイル一覧と機械的に突き合わせられ、一致すれば
  #      VIOLATION としてコミット・完了が止まる。
  # 【機械的に止まらない範囲】2. に渡される変更ファイル一覧は呼び出し側2箇所とも
  # git の差分から作られる。git 管理外のパスは差分に現れないため、ここに書いても
  # 機械的には止まらず、1. の指示としてのみ効く。次のパスが該当する。
  #   - ".backlog/" 配下（この config.my.yml 自身を含む。つまりエージェントを縛る
  #     この設定の書き換えは検知されない）
  #   - ".claude/skills/<スキル名>" 配下（配布元へのシンボリックリンク。書き換えると
  #     同じ配布元を共有する他の導入先にも波及するが、このリポジトリの差分には出ない）
  #   - ".git/" 配下（.git/info/exclude 自身を含む）
  # これらを守りたい場合は、ここへの記載だけに頼らず人間のレビューを前提にすること。
  # 記法はインライン配列（例: ["secrets/", "vendor/"]）でも、次行以降に
  # `- "secrets/"` と1行1件で並べる複数行YAMLリストでもよい。
  # 既定値: []（空配列、またはキー自体が無い場合は制限なし）
  forbidden_paths: []

  # AIエージェントが変更してよいパス（許可リスト）。設定すると、ここに挙げたパス以外への
  # 変更を避けるよう引き渡しプロンプトに明記され、同じ機械的な照合の対象にもなる。
  # forbidden_paths と併用した場合は「許可リストの範囲内、かつ禁止リストに無いパス」
  # だけが許可される。機械的に止まらない範囲は forbidden_paths と同じである。
  # 記法も forbidden_paths と同じ。
  # 既定値: []（空配列、またはキー自体が無い場合は制限なし）
  allowed_paths: []
